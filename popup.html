<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="hdr">
    <div class="brand">
      <span class="dot live" id="dot"></span>
      <span class="name">Details of a Web Feature</span>
      <span class="ver">v2.5</span>
    </div>
    <div class="status-pill active" id="status">Active (Auto)</div>
  </header>

  <!-- Target active tab banner -->
  <section class="target-banner">
    <span class="target-dot"></span>
    <span class="target-title" id="targetTitle">Active Tab</span>
    <span class="target-url" id="targetUrl">-</span>
  </section>

  <!-- Main Hero Download Button -->
  <section class="download-hero">
    <button id="dlAll" class="btn-hero" title="Download entire DevTools dump into an organized ZIP folder">
      <span class="hero-icon">⬇</span>
      <div class="hero-text">
        <span class="hero-title">Download All (Complete DevTools Dump)</span>
        <span class="hero-sub" id="heroSub">Saves Elements, Sources, Network, Memory & Console in a single ZIP</span>
      </div>
    </button>
  </section>

  <!-- DevTools Tabs Download Bar -->
  <section class="devtools-tabs-bar">
    <div class="tabs-label">Download Specific DevTools Tabs:</div>
    <div class="tabs-buttons">
      <button id="dlNetwork" class="tab-btn" title="Download Network requests, payloads, HAR, and CSV">🌐 Network</button>
      <button id="dlElements" class="tab-btn" title="Download rendered DOM HTML and element tree">📄 Elements</button>
      <button id="dlSources" class="tab-btn" title="Download all captured JavaScript and CSS source files">💻 Sources</button>
      <button id="dlMemory" class="tab-btn" title="Download LocalStorage, SessionStorage, Cookies, and Globals">🧠 Memory</button>
      <button id="dlConsole" class="tab-btn" title="Download captured console logs and errors">📜 Console</button>
    </div>
  </section>

  <!-- Toggles Bar -->
  <section class="toggles-bar">
    <label class="toggle-item" title="Automatically attach and capture current tab">
      <input type="checkbox" id="autoCaptureToggle" checked />
      <span>⚡ Auto-Capture</span>
    </label>
    <label class="toggle-item" title="Automatically switch target when you switch browser tabs">
      <input type="checkbox" id="autoSwitchToggle" checked />
      <span>🎯 Auto-Switch Tab</span>
    </label>
    <label class="toggle-item" title="Automatically clean old logs on reload to prevent storage burn out">
      <input type="checkbox" id="autoClearToggle" checked />
      <span>🔄 Auto-Clear on Reload</span>
    </label>
  </section>

  <!-- Stats Grid -->
  <section class="stats-overview">
    <div class="stat-card">
      <span class="lbl">Network Requests</span>
      <span class="val" id="netCount">0</span>
    </div>
    <div class="stat-card">
      <span class="lbl">Parsed Sources</span>
      <span class="val" id="sourcesCount">0</span>
    </div>
    <div class="stat-card">
      <span class="lbl">Console Logs</span>
      <span class="val" id="consoleCount">0</span>
    </div>
    <div class="stat-card">
      <span class="lbl">Transferred</span>
      <span class="val" id="bytes">0 B</span>
    </div>
  </section>

  <!-- Category Filter Pills -->
  <section class="categories-bar">
    <button class="cat-pill active" data-cat="">All</button>
    <button class="cat-pill" data-cat="Fetch/XHR">Fetch/XHR <b id="cXhr">0</b></button>
    <button class="cat-pill" data-cat="Media">Media <b id="cMedia">0</b></button>
    <button class="cat-pill" data-cat="Document">Doc <b id="cDoc">0</b></button>
    <button class="cat-pill" data-cat="JavaScript">JS <b id="cJs">0</b></button>
    <button class="cat-pill" data-cat="CSS">CSS <b id="cCss">0</b></button>
    <button class="cat-pill" data-cat="Image">Img <b id="cImg">0</b></button>
    <button class="cat-pill" data-cat="WebSocket">Socket <b id="cWs">0</b></button>
    <button class="cat-pill" data-cat="Other">Other <b id="cOther">0</b></button>
  </section>

  <!-- Filter & Clear -->
  <section class="filterbar">
    <input id="filter" placeholder="Filter requests by URL, endpoint, method, status…" />
    <button id="clearBtn" class="btn-clear" title="Clear current logs to free storage">Clear</button>
  </section>

  <!-- Requests List -->
  <section class="list" id="list"></section>

  <footer class="ftr">
    <span class="ftr-hint">Inspect panel active • Storage auto-managed</span>
    <a id="openPanel" href="#" class="link">DevTools View ↗</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
